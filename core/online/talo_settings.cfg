; Talo's settings file (https://docs.trytalo.com/1.x/godot/settings-reference), at the path in
; the talo/settings/settings_path project setting. The Talo plugin's export plugin packs it into
; the build. docs/online.md says what each choice here is for.
;
; access_key: from the Talo dashboard (API keys page). This file ships as plain text in every
; build, dev and release alike, so anyone who downloads the game can read the key anyway.
; Committing it is fine for a jam. Empty keeps Online offline everywhere.
; auto_connect_socket and auto_start_session: off, so nothing reaches the network at boot.
; Online opens the socket once the player is identified, and only in web builds.

access_key=""
api_url="https://api.trytalo.com"
socket_url="wss://api.trytalo.com"
auto_connect_socket=false
handle_tree_quit=true
cache_player_on_identify=true
debounce_timer_seconds=0.5
requests_use_threads=false
compress_requests=true

[continuity]

enabled=true

[player_auth]

auto_start_session=false
