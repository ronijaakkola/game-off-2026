[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="ui/main_menu/build_commit.txt"
exclude_filter="addons/gdUnit4/*, addons/talo/samples/*, addons/limbo_console/*, addons/limbo_console.cfg, addons/phantom_camera/assets/*, addons/phantom_camera/fonts/*, addons/phantom_camera/icons/*.png, addons/phantom_camera/panel/*, addons/phantom_camera/themes/*, icon.png, ui/audio/menu_music.ogg, ui/main_menu/boot_splash.png, core/dev_console/dev_commands.gd, test/*, build/*, tools/*"
export_path="build/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
progressive_web_app/enabled=false
html/head_include="<style>
/* The loading page: the boot splash (the logo on the title card's navy) and a thin bar in
the route's orange under the logo, both scaled as the game's 1152 x 648 base is. */
#status {
	background-color: #171335;
}
#status-progress {
	-webkit-appearance: none;
	appearance: none;
	top: calc(50% + 113 * min(100vw / 1152, 100vh / 648));
	bottom: auto;
	width: calc(240 * min(100vw / 1152, 100vh / 648));
	height: max(3px, calc(4 * min(100vw / 1152, 100vh / 648)));
	border: 0;
	border-radius: 999px;
	overflow: hidden;
	background-color: rgba(255, 255, 255, 0.14);
}
#status-progress::-webkit-progress-bar {
	background-color: transparent;
}
#status-progress::-webkit-progress-value {
	background-color: #ff9938;
	border-radius: 999px;
}
#status-progress::-moz-progress-bar {
	background-color: #ff9938;
	border-radius: 999px;
}
</style>"

