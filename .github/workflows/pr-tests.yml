name: pr
on:
  pull_request:
concurrency:
  group: pr-tests-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  test:
    # The name stays: branch protection requires a check called "gdUnit4 tests".
    name: gdUnit4 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      # The same headless run as locally and on main, so frame times match. It prints each
      # failing test and fails when no tests ran.
      - name: Tests
        run: uv run tools/check.py test
  checks:
    name: Lint, load check, smoke run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Lint
        run: uv run tools/check.py lint
      - name: Load check
        run: uv run tools/check.py load
      - name: Smoke run
        run: uv run tools/check.py smoke
